<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/aura_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Discover our premium culinary creations, hand-crafted pasta dishes, wood-fired grills, and signature drinks at AURA. Scan the QR code at your table to browse and order." />
    <link rel="manifest" href="/manifest.json" />
    <title>AURA</title>
  </head>
  <body>
    <!-- 4-Second Unskippable 3D Loader Overlay -->
    <div id="initial-loader-overlay">
      <style>
        #initial-loader-overlay {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          /* Brand colours are filled in per restaurant by the script below */
          background-color: var(--splash-bg, #121316);
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          transition: opacity 0.5s ease-in-out, visibility 0.5s, background-color 0.3s ease;
        }
        .loader-content {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          /* Centre name + chef hat together (the hat hangs ~60px past the end of the name) */
          transform: translateX(-30px);
        }
        
        .wind-text {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          animation: windFlyText 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .aura-title {
          font-family: 'Playfair Display', Georgia, serif;
          font-weight: 500;
          font-style: italic;
          font-size: 64px;
          letter-spacing: 6px;
          color: var(--splash-accent, #c9a876);
          margin-left: 6px;
          line-height: 1.1;
          /* One line, so the chef hat lands next to the name instead of at the screen edge */
          white-space: nowrap;
          transition: color 0.3s ease;
        }

        .aura-subtitle {
          font-family: 'Playfair Display', Georgia, serif;
          font-weight: 400;
          font-style: italic;
          font-size: 32px;
          letter-spacing: 12px;
          color: rgba(230, 235, 240, 0.9); /* Whitish silver */
          text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
          margin-top: 2px;
          margin-left: 12px;
        }

        .wind-hat {
          position: absolute;
          /* Perch just past the end of the name, slightly raised */
          top: -42px;
          right: -76px;
          width: 90px;
          height: 90px;
          animation: windFlyHat 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
          z-index: 10;
        }
        
        .glassy-chef-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          border-radius: 50%;
          opacity: 0.95;
          mask-image: radial-gradient(circle, black 40%, transparent 65%);
          -webkit-mask-image: radial-gradient(circle, black 40%, transparent 65%);
          filter: drop-shadow(0 0 10px rgba(201, 168, 118, 0.2));
          filter: drop-shadow(0 0 10px color-mix(in srgb, var(--splash-accent, #c9a876) 25%, transparent));
        }

        @keyframes windFlyText {
          0% { transform: translateX(-150vw) rotate(-5deg); opacity: 0; }
          20% { transform: translateX(10px) rotate(2deg); opacity: 1; }
          30% { transform: translateX(0) rotate(0deg); opacity: 1; }
          80% { transform: translateX(0) rotate(0deg); opacity: 1; }
          100% { transform: translateX(-150vw) rotate(-5deg); opacity: 0; }
        }

        @keyframes windFlyHat {
          0% { transform: translate(100vw, -50vh) rotate(90deg) scale(0.5); opacity: 0; }
          25% { transform: translate(-10px, -5px) rotate(10deg) scale(1.1); opacity: 1; }
          35% { transform: translate(0, 0) rotate(25deg) scale(1); opacity: 1; } /* Lands tilted */
          75% { transform: translate(0, 0) rotate(25deg) scale(1); opacity: 1; }
          100% { transform: translate(100vw, -50vh) rotate(90deg) scale(0.5); opacity: 0; }
        }
      </style>
      <div class="loader-content">
        <div class="wind-text">
          <div class="aura-title" id="loader-title">AURA</div>
          <div class="aura-subtitle" id="loader-subtitle">Menu</div>
        </div>
        <div class="wind-hat">
          <img src="/images/glassy_3d_chef.png" alt="Glassy Chef Hat" class="glassy-chef-img" />
        </div>
      </div>
    </div>
    
    <script>
      // Show the restaurant's own name and colours on the splash.
      // Colours come from (1) the last visit, cached by the app, then (2) the menu request below,
      // which the app reuses (window.__azaiMenuPrefetch) so the menu is not fetched twice.
      (function() {
        var overlay = document.getElementById('initial-loader-overlay');
        var titleEl = document.getElementById('loader-title');
        var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
        // QR links are /m/<slug> and some admin links are /admin/<slug>: skip those prefixes
        var segments = path ? path.split('/') : [];
        if (segments.length > 1 && (segments[0] === 'm' || segments[0] === 'admin')) {
          segments.shift();
        }
        if (!segments.length || !segments[0] || !titleEl) return;
        var slug = decodeURIComponent(segments[0]).toLowerCase().trim();

        function setName(name) {
          titleEl.textContent = name;
          document.title = name + ' — Menu';
          // Shrink long names so name + chef hat fit on one line within the screen
          var chars = Math.max(name.length, 4);
          titleEl.style.fontSize = 'min(64px, ' + (56 / (chars * 0.62)).toFixed(2) + 'vw)';
        }
        function applyBrand(brand) {
          if (!brand) return;
          if (brand.name) setName(brand.name);
          if (brand.primary) overlay.style.setProperty('--splash-accent', brand.primary);
          if (brand.darkBar) overlay.style.setProperty('--splash-bg', brand.darkBar);
        }

        // "little-china" -> "Little China" until the real name is known
        setName(slug.split(/[-_\s]+/).map(function (w) {
          return w.charAt(0).toUpperCase() + w.slice(1);
        }).join(' '));

        try {
          applyBrand(JSON.parse(localStorage.getItem('azai:brand:' + slug) || 'null'));
        } catch (e) {}

        var apiUrl = '%VITE_API_URL%';
        if (window.fetch && apiUrl.charAt(0) !== '%') {
          var request = fetch(apiUrl + '/menus/' + encodeURIComponent(slug))
            .then(function (res) { return res.ok ? res.json() : null; })
            .catch(function () { return null; });
          window.__azaiMenuPrefetch = { slug: slug, promise: request };
          request.then(function (body) {
            var tenant = body && body.data && body.data.tenant;
            if (!tenant) return;
            var theme = tenant.theme_config || {};
            applyBrand({ name: tenant.name, primary: theme.primaryColor || theme.primary, darkBar: theme.darkBar });
          });
        }
      })();

      // Smoothly hide the splash animation once the page is ready
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader-overlay');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(() => loader.remove(), 400);
          }
        }, 900);
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
